# webrtcAdditionalHosts is controlled via the .env file (MTX_WEBRTCADDITIONALHOSTS)
# webrtcAdditionalHosts: []
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
hlsAddress: :8888

api: yes
apiAddress: :9997

authInternalUsers:
# Previous unauthenticated RTSP pattern (kept for reference):
#  - user: any
#    pass:
#    ips: []
#    permissions:
#      - action: publish
#      - action: read
#      - action: playback

# Current RTSP account used by FFmpeg and workers.
  - user: user
    pass: mediamtx
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

# Separate account for worker MediaMTX API calls.
  - user: worker
    pass: mediamtx
    ips: []            # a LAN filter can fail behind Docker NAT; the isolated defense network is the boundary
    permissions:
      - action: api

paths:
  all_others:
